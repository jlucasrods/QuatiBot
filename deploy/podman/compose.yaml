name: ${COMPOSE_PROJECT_NAME:-quatibot-podman}
services:
  quati:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/quatibot-podman:${QUATI_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers.
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${QUATI_DATA_ROOT:?Run setup.sh first}:${QUATI_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/quati-podman.sock
    environment:
      HOME: ${QUATI_DATA_ROOT}
      QUATI_DATA_DIR: ${QUATI_DATA_ROOT}/.quatibot
      QUATI_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/quati-podman.sock
      QUATI_PORT: ${QUATI_PORT:-8799}
      QUATI_WEBHOOK_PORT: ${QUATI_WEBHOOK_PORT:-8800}
      QUATI_PUBLIC_URL: ${QUATI_PUBLIC_URL:-http://localhost:8080}
      QUATI_WEBHOOK_PUBLIC_URL: ${QUATI_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$QUATI_PORT/api/health | grep -q quatibot']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      quati:
        condition: service_healthy
    environment:
      QUATI_HTTP_PORT: ${QUATI_HTTP_PORT:-8080}
      QUATI_PORT: ${QUATI_PORT:-8799}
      QUATI_WEBHOOK_PORT: ${QUATI_WEBHOOK_PORT:-8800}
      QUATI_HTTPS_HOST: ${QUATI_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:

name: quatibot
services:
  quati:
    build:
      context: ..
    image: ghcr.io/jlucasrods/quatibot:latest
    init: true
    shm_size: 512m
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${QUATI_BIND_ADDRESS:-127.0.0.1}:${QUATI_HTTP_PORT:-8080}:80"
      - "${QUATI_BIND_ADDRESS:-127.0.0.1}:${QUATI_HTTPS_PORT:-8443}:443"
    environment:
      QUATI_PUBLIC_URL: ${QUATI_PUBLIC_URL:-http://localhost:8080}
      QUATI_WEBHOOK_PUBLIC_URL: ${QUATI_PUBLIC_URL:-http://localhost:8080}
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    network_mode: service:quati
    depends_on:
      quati:
        condition: service_healthy
        restart: true
    environment:
      QUATI_SITE: ${QUATI_SITE:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
  caddy_data:
  caddy_config:

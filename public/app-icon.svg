<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">QuatiBot</title>
  <desc id="desc">A curious coati mascot with a long snout, raised eyebrow and striped tail, transparent background for app icon.</desc>

  <!-- Cauda Anelada (Erguida e Preenchendo o Canto Superior Direito) -->
  <g id="cauda">
    <!-- Base da cauda -->
    <path d="M 305 435 C 430 430 475 320 455 210 C 440 120 370 52 315 90"
          fill="none" stroke="#89d7ad" stroke-width="64" stroke-linecap="round"/>
    <!-- Anéis escuros da cauda -->
    <path d="M 305 435 C 430 430 475 320 455 210 C 440 120 370 52 315 90"
          fill="none" stroke="#284c3b" stroke-width="64" stroke-linecap="butt"
          stroke-dasharray="32 32" stroke-dashoffset="16"/>
    <!-- Ponta escura da cauda -->
    <circle cx="315" cy="90" r="32" fill="#284c3b"/>
  </g>

  <!-- Orelha Traseira -->
  <path d="M 220 220 C 220 178 255 165 268 192 C 278 210 262 245 240 245 Z" fill="#284c3b"/>
  <path d="M 230 216 C 230 188 248 180 258 198 C 262 210 252 234 240 234 Z" fill="#89d7ad"/>

  <!-- Corpo e Cabeça (Preenchendo a Base e a Lateral Esquerda) -->
  <path d="M 185 220
           C 135 235 80 290 42 332
           C 30 340 28 352 38 360
           C 50 368 85 370 120 388
           C 145 400 135 440 135 475
           L 325 475
           C 335 415 315 315 255 240
           C 230 225 210 220 185 220 Z"
        fill="#89d7ad"/>

  <!-- Mancha Clara do Peito -->
  <path d="M 125 395 C 145 408 135 442 135 475 L 205 475 C 205 430 192 390 150 372 Z" fill="#eef4e9"/>

  <!-- Pata Dianteira -->
  <path d="M 170 405 C 158 425 158 458 160 475" fill="none" stroke="#284c3b" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="150" cy="475" rx="18" ry="6" fill="#284c3b"/>

  <!-- Orelha Dianteira -->
  <path d="M 180 228 C 172 188 195 166 216 174 C 235 181 235 216 218 236 Z"
        fill="#89d7ad" stroke="#284c3b" stroke-width="9" stroke-linejoin="round"/>
  <path d="M 190 221 C 185 196 200 181 212 186 C 220 193 220 213 210 226 Z" fill="#eef4e9"/>

  <!-- Máscara Facial Escura do Quati -->
  <path d="M 65 330
           C 100 312 145 282 190 282
           C 210 282 220 296 214 315
           C 204 338 170 350 132 350
           C 94 350 74 340 65 330 Z"
        fill="#284c3b"/>

  <!-- Mancha Clara do Focinho e Queixo -->
  <path d="M 38 346
           C 44 340 64 338 90 341
           C 110 343 122 360 112 378
           C 96 382 66 374 44 360
           C 36 355 36 348 38 346 Z"
        fill="#eef4e9"/>

  <!-- Marcas Claras nos Olhos -->
  <ellipse cx="148" cy="278" rx="9" ry="5" fill="#eef4e9" transform="rotate(-15 148 278)"/>
  <ellipse cx="144" cy="322" rx="11" ry="6" fill="#eef4e9" transform="rotate(10 144 322)"/>

  <!-- Olho Expressivo com Íris e Brilho -->
  <ellipse cx="148" cy="300" rx="16" ry="18" fill="#eef4e9"/>
  <ellipse cx="145" cy="300" rx="10" ry="12" fill="#101916"/>
  <circle cx="141" cy="295" r="4.5" fill="#ffffff"/>
  <circle cx="149" cy="304" r="2" fill="#ffffff"/>

  <!-- Sobrancelha Erguida (Curiosa) -->
  <path d="M 128 266 C 141 258 158 260 171 268" fill="none" stroke="#101916" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Trufa do Focinho (Nariz Arrebitado) -->
  <path d="M 42 330 C 29 335 25 350 34 358 C 42 364 52 360 53 350 C 54 340 49 332 42 330 Z" fill="#101916"/>
  <ellipse cx="36" cy="342" rx="4" ry="6" fill="#89d7ad" opacity="0.6" transform="rotate(-20 36 342)"/>

  <!-- Linha da Boca -->
  <path d="M 44 358 C 56 366 74 368 92 363" fill="none" stroke="#284c3b" stroke-width="5" stroke-linecap="round"/>
</svg>

name: ${COMPOSE_PROJECT_NAME:-quatibot}
services:
  quati:
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${QUATI_BASE_IMAGE:-ghcr.io/jlucasrods/quatibot:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${QUATI_LOCAL_IMAGE:-quatibot-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${QUATI_BIND_ADDRESS:-127.0.0.1}:${QUATI_HTTP_PORT:-8080}:80"
    environment:
      QUATI_PORT: "8799"
      QUATI_WEBHOOK_PORT: "8800"
      QUATI_PUBLIC_URL: ${QUATI_PUBLIC_URL:-http://localhost:${QUATI_HTTP_PORT:-8080}}
      QUATI_WEBHOOK_PUBLIC_URL: ${QUATI_WEBHOOK_PUBLIC_URL:-${QUATI_PUBLIC_URL:-http://localhost:${QUATI_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('quatibot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:quati
    environment:
      QUATI_HTTPS_HOST: ${QUATI_HTTPS_HOST:-}
      QUATI_BIND_ADDRESS: ${QUATI_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export QUATI_UPSTREAM_SCHEME=http
        if [ -n "$$QUATI_HTTPS_HOST" ] && [ "$$QUATI_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "QUATI_HTTPS_HOST requires QUATI_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$QUATI_HTTPS_HOST" ]; then
          export QUATI_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      quati:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${QUATI_DATA_EXTERNAL:-false}
    name: ${QUATI_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-quatibot}_data}
  caddy_data:
  caddy_config:

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs CI on the PR merged onto the current main BEFORE it
  # lands, so a PR that is green alone but red together with what just
  # merged is stopped in the queue instead of on main (that shape reddened
  # main twice in Sep 2026). Turning the queue on is a branch-ruleset
  # setting; this trigger is what lets CI report on those runs.
  merge_group:

# least privilege: CI only reads the checkout, it never writes back
permissions:
  contents: read

concurrency:
  # A new PR push supersedes that PR's older checks. Main keeps one run going
  # and one waiting: each merge replaces the waiting run, so a burst of
  # merges costs two full runs, not one per merge (fifteen queued behind each
  # other in October 2026). The running one always finishes. A release runs
  # CI on its own commit in a release-ci/v<version> lane when main's run for
  # it was replaced (scripts/release-ci.mjs). Merge-queue runs stay on their
  # own refs. A PR's group is named by its number, never by github.ref: a
  # merged PR's closed event reports the base branch as github.ref, so a
  # ref-named group let every merge cancel main's run (ci-stop-closed.yml).
  group: ci-${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── The test leg, in pieces ──────────────────────────────────────────────
  # One `typecheck + test (<os>)` job used to run everything in sequence:
  # typecheck, lint, the whole vitest suite, then three smokes that only ran
  # when everything before them passed. The suite runs its files serially
  # (vite.config.ts, fileParallelism:false) and takes 17–19 minutes on one
  # runner, so slow runners hit the job cap and read as red PRs, and a broken
  # smoke stayed hidden behind any vitest failure for a day. Each piece is now
  # its own job: platform-independent checks run once, the suite runs in four
  # shards per platform, and every smoke reports on its own. One final `CI`
  # check aggregates the required jobs.
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # ci-scope reads whether the commit before a push got its own green run
      actions: read
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      vitest_os: ${{ steps.scope.outputs.vitest_os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets PR selection use the merge base, including deletes
          # and both sides of renames, without GitHub's changed-file page limit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Select checks for this change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs
      - run: pnpm install --frozen-lockfile
      - name: Verify CI selection and documentation references
        run: pnpm exec vitest run scripts/ci-scope.test.ts scripts/ci-workflow.test.ts scripts/testing/verification-docs.test.ts
      - name: Validate locale catalogs
        run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: production UI build
        run: pnpm exec vite build

  vitest:
    # Admit the expensive runner fan-out only after the quick checks pass.
    # A failing preflight still fails the required gates; nothing is waived.
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # vitest splits the file list deterministically across shards, so a
    # failure names the same shard on every run and one shard is reproducible
    # locally with the same --shard flag.
    name: vitest (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.vitest_os) }}
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        # The github-actions reporter turns each failure into an annotation
        # on the PR, so the failing test and its assertion are readable
        # without opening the job log.
        env:
          # scripts/testing/ci-retry-runner.ts records each listed flaky test
          # that needed a retry here (the runner context is step-level only).
          QUATI_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=github-actions
      - name: Report flaky tests that needed a retry
        # Known flakes (scripts/testing/ci-retry-list.json) get two retries in
        # CI. A pass after a retry is still listed in the job summary, so the
        # flake stays visible until its entry is fixed and removed.
        if: ${{ !cancelled() }}
        env:
          QUATI_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs

  behavior-evals:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # The offline behavior-eval tiers (#1503): the evals' own vitest gate
    # (redaction, trace, golden replay), the tier-1 scenario runner, and the
    # tier-2 golden replay through the same entrypoint developers use. Tier
    # 3's live models stay opt-in: CI never sets QUATI_EVAL_LIVE or any live
    # env, and the last step proves the offline gate holds by asserting the
    # skip line is what CI gets.
    name: behavior evals (offline tiers 1-3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Eval suite typecheck (standalone tsconfig)
        # The root typecheck builds src and server only; evals carries its
        # own tsconfig, so its type gate runs here with the rest of the
        # eval surfaces.
        run: pnpm exec tsc -p evals/tsconfig.json
      - name: Eval vitest gate (redaction, trace, golden replay)
        # Same reporter pair as the vitest shards, so a failure annotates
        # the PR with the failing test and assertion.
        run: pnpm exec vitest run --config evals/vitest.config.ts --reporter=default --reporter=github-actions
      - name: Tier 1 scenarios (scripted harness, no models)
        run: pnpm eval
      - name: Tier 2 golden replay against committed baselines
        run: pnpm eval --golden
      - name: Tier 3 stays offline in CI (the skip is the pass condition)
        run: |
          output="$(pnpm eval --live 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "live tier skipped"
      - name: Upload eval run reports on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: behavior-evals-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: evals/reports/runs/
          if-no-files-found: warn
          retention-days: 7

  packaged-server:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: packaged server smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packaged-server

  gate:
    # One aggregation, not three queued runners doing the same check.
    name: CI
    needs: [static, vitest, behavior-evals, packaged-server]
    # Still report failed/skipped dependencies, but don't keep a superseded
    # workflow alive just to schedule its summary jobs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const needs = JSON.parse(process.env.NEEDS);
            const rows = Object.entries(needs).map(([job, { result }]) => `${result.padEnd(9)} ${job}`);
            console.log(rows.join("\n"));
            const runtime = needs.static.outputs.runtime;
            if (runtime !== "true" && runtime !== "false") throw new Error("Missing CI selection");
            const bad = Object.entries(needs).filter(([job, { result }]) => {
              const expected = job === "static" || runtime === "true" ? "success" : "skipped";
              return result !== expected;
            });
            if (bad.length) { console.error(`\n${bad.length} required job(s) did not pass: ${bad.map(([job]) => job).join(", ")}`); process.exit(1); }
          '

  foss:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # LICENSING.md promises that deleting enterprise/ leaves a working
    # open-source edition. Prove it on runtime changes: typecheck, the edition
    # tests, and a boot that reports "oss" even with a key set.
    name: open-source edition builds without enterprise/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the enterprise folder
        run: rm -rf enterprise
      - run: pnpm typecheck
      - run: pnpm exec vitest run server/enterprise.test.ts server/brand.test.ts
      - name: The server boots and reports the open-source edition
        run: |
          mkdir -p /tmp/quati-foss/home
          HOME=/tmp/quati-foss/home QUATI_DATA_DIR=/tmp/quati-foss/data QUATI_PORT=18797 QUATI_WEBHOOK_PORT=18796 \
            QUATI_BROWSER_CONNECTION=/tmp/quati-foss/browser-connection.json QUATI_LICENSE_KEY=omb1.not.real \
            node --experimental-strip-types server/index.ts > /tmp/quati-foss/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18797/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18797/api/edition | tee /tmp/quati-foss/edition.json; echo
          grep -q '"edition":"oss"' /tmp/quati-foss/edition.json
          grep -q 'no enterprise layer exists' /tmp/quati-foss/edition.json
          kill %1; wait %1 || true

  ui-smoke:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # Advisory, outside the required `test` matrix: the renderer recipe in
    # It downloads the pinned
    # agent-browser release (digest verified) and its Chrome, drives the real
    # <App/> against the isolated fake-engine fixture, and keeps the screenshot.
    name: renderer smoke (control-quati ui, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner
        # Ubuntu 24.04's AppArmor profile blocks unprivileged user namespaces,
        # so the downloaded Chrome for Testing dies with "No usable sandbox".
        # This is Chrome's own documented fix for 23.10+; a developer machine
        # needs nothing, and the sandbox itself stays on.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Drive the real renderer through control-quati ui
        env:
          QUATI_UI_E2E: "1"
          QUATI_UI_EVIDENCE_DIR: .quati-scratch/verify-evidence
        run: pnpm exec vitest run scripts/testing/control-quati-ui.e2e.test.ts scripts/testing/bot-tools-ui.e2e.test.ts scripts/testing/thinking-timer-ui.e2e.test.ts scripts/testing/team-share-ui.e2e.test.ts scripts/testing/org-library-ui.e2e.test.ts scripts/testing/presets-ui.e2e.test.ts scripts/testing/browser-evidence.e2e.test.ts
      - name: Upload the renderer screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: control-quati-ui-chat-screenshot
          path: |
            .quati-scratch/verify-evidence/chat-ui.png
            .quati-scratch/verify-evidence/thinking-timer-anchored.png
            .quati-scratch/verify-evidence/share-team-dialog.png
          if-no-files-found: warn
          retention-days: 7

  browser-identity:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # Advisory, outside the required gate: the pinned agent-browser drives a
    # real Chrome for Testing through QUATI's launcher and identity connection
    # (scripts/testing/browser-identity.e2e.test.ts): a 1280x720 page whose
    # user agent and client hints are the browser's own in the page, a
    # worker, a service worker and a cross-site frame. On Windows this is
    # also the check that the 0.36.0-quati.1 engine starts Chrome through the
    # generated batch file. The same platforms as the vitest matrix.
    name: browser identity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.vitest_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Drive a real Chrome through the launcher
        env:
          QUATI_UI_E2E: "1"
        run: pnpm exec vitest run scripts/testing/browser-identity.e2e.test.ts

  package-linux:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: package + smoke (Ubuntu 24.04 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package from the verified offline CUA stage
        run: pnpm package:linux:offline
      - run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Verify the installed browser with Ubuntu sandbox restrictions
        run: node scripts/smoke-browser-bundle.mjs --resources /opt/QuatiBot/resources
      - name: Launch packaged app and verify lifecycle
        env:
          QUATI_KEEP_SMOKE_DIR: "1"
          QUATI_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge quatibot || true
      - name: Upload smoke diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: quatibot-ubuntu-smoke-diagnostics
          path: |
            /tmp/quati-linux-smoke-*
            /tmp/quati-linux-smoke-runtime-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  browser-driver:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # Advisory, outside the CI gate until it has run green for a while: the
    # quati-cdp S4 conformance suites and the new browser's checklist and viewer
    # suites on the runner's own Google Chrome (PRs run Linux and Windows;
    # main pushes, merge groups and manual runs add macOS, as for the vitest
    # shards), then on Linux inside the server image's runtime as a non-root
    # user. Every S4 suite also fails when its trace holds Runtime.enable or
    # another forbidden CDP method.
    name: browser driver S4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.vitest_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner, and give it a display
        # Ubuntu 24.04 restricts unprivileged user namespaces; Chrome's own
        # documented fix for 23.10+. The sandbox itself stays on.
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: S4 on the runner's Google Chrome
        # The headed-identity case needs a display, which Linux runners get from Xvfb.
        env:
          QUATI_CDP_E2E: "1"
        shell: bash
        run: |
          run=(pnpm exec vitest run server/browser/cdp/s4- server/browser/checklist.e2e server/browser/viewers/viewers.e2e --reporter=verbose --silent=false --reporter=github-actions)
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "${run[@]}"; else "${run[@]}"; fi
      - name: S4 inside the server image's runtime, as its own user
        # quati, with its real home, as the server runs there. The image's
        # Chrome for Testing has no setuid sandbox helper yet, so this leg
        # runs with the operator opt-out; the host legs keep the sandbox.
        # Vitest writes its bundled config beside it and its cache under
        # node_modules/.vite, so those two places are opened to quati. It runs
        # even when the host leg failed: they test different Chromes.
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          docker build --target runtime -t quati-runtime:s4 .
          mkdir -p node_modules/.vite && chmod a+w . node_modules/.vite
          docker run --rm --init --shm-size=512m --user quati -e CI=true \
            -e QUATI_CDP_CHROME=/opt/quatibot-browser/chrome -e QUATI_CDP_HOST=container -e QUATI_BROWSER_SANDBOX=0 \
            -v "$PWD:/src" -w /src quati-runtime:s4 \
            node node_modules/vitest/vitest.mjs run server/browser/cdp/s4- server/browser/checklist.e2e server/browser/viewers/viewers.e2e --reporter=verbose --silent=false

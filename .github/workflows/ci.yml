name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      vitest_os: ${{ steps.scope.outputs.vitest_os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Select checks for this change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs
      - run: pnpm install --frozen-lockfile
      - name: Verify CI selection and documentation references
        run: pnpm exec vitest run scripts/ci-scope.test.ts scripts/ci-workflow.test.ts scripts/testing/verification-docs.test.ts
      - name: Validate locale catalogs
        run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: production UI build
        run: pnpm exec vite build

  vitest:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: vitest (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.vitest_os) }}
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        env:
          QUATI_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=github-actions
      - name: Report flaky tests that needed a retry
        if: ${{ !cancelled() }}
        env:
          QUATI_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs

  behavior-evals:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: behavior evals (offline)
    env:
      QUATI_EVAL_LIVE: "0"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Eval suite typecheck (standalone tsconfig)
        run: pnpm exec tsc -p evals/tsconfig.json
      - name: Eval vitest gate (redaction, trace, golden replay)
        run: pnpm exec vitest run --config evals/vitest.config.ts --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=evals/reports/runs/offline.xml
      - name: Tier 3 stays offline in CI (the skip is the pass condition)
        run: |
          output="$(pnpm eval --live 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "live tier skipped"
      - name: Upload eval run reports on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: behavior-evals-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: evals/reports/runs/
          if-no-files-found: warn
          retention-days: 7

  packaged-server:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: packaged server smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:packaged-server

  gate:
    name: CI
    needs: [static, vitest, behavior-evals, packaged-server, ui-smoke, browser-identity, browser-driver]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const needs = JSON.parse(process.env.NEEDS);
            const rows = Object.entries(needs).map(([job, { result }]) => `${result.padEnd(9)} ${job}`);
            console.log(rows.join("\n"));
            const runtime = needs.static.outputs.runtime;
            if (runtime !== "true" && runtime !== "false") throw new Error("Missing CI selection");
            const bad = Object.entries(needs).filter(([job, { result }]) => {
              const expected = job === "static" || runtime === "true" ? "success" : "skipped";
              return result !== expected;
            });
            if (bad.length) { console.error(`\n${bad.length} required job(s) did not pass: ${bad.map(([job]) => job).join(", ")}`); process.exit(1); }
          '

  ui-smoke:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: renderer smoke (control-quati ui, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Drive the real renderer through control-quati ui
        env:
          QUATI_UI_E2E: "1"
          QUATI_UI_EVIDENCE_DIR: .quati-scratch/verify-evidence
        run: pnpm exec vitest run scripts/testing/control-quati-ui.e2e.test.ts scripts/testing/bot-tools-ui.e2e.test.ts scripts/testing/thinking-timer-ui.e2e.test.ts scripts/testing/team-share-ui.e2e.test.ts scripts/testing/presets-ui.e2e.test.ts scripts/testing/browser-evidence.e2e.test.ts
      - name: Upload renderer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: control-quati-ui-chat-screenshot
          path: .quati-scratch/verify-evidence/*.png
          if-no-files-found: warn
          retention-days: 7

  browser-identity:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: browser identity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.vitest_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Drive a real Chrome through the launcher
        env:
          QUATI_UI_E2E: "1"
        run: pnpm exec vitest run scripts/testing/browser-identity.e2e.test.ts

  browser-driver:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: browser driver S4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.vitest_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner, and give it a display
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: S4 on the runner's Google Chrome
        env:
          QUATI_CDP_E2E: "1"
        shell: bash
        run: |
          run=(pnpm exec vitest run server/browser/cdp/s4- server/browser/checklist.e2e server/browser/viewers/viewers.e2e --reporter=verbose --silent=false --reporter=github-actions)
          xvfb-run -a "${run[@]}"

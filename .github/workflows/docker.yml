name: Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - server/**
      - src/**
      - scripts/bundle-server.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: build image + boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t quatibot:ci .
      - name: Boot the container and prove the server + UI answer
        run: |
          set -euo pipefail
          docker run -d --name quati quatibot:ci
          for i in $(seq 1 40); do
            if docker exec quati curl -sf http://127.0.0.1:8799/api/health | grep -q quatibot; then break; fi
            sleep 2
            if [ "$i" = "40" ]; then docker logs quati; echo "server never became healthy"; exit 1; fi
          done
          # the renderer is served by the server itself (QUATI_STATIC_DIR)
          docker exec quati curl -sf http://127.0.0.1:8799/ | grep -qi "<html" || { docker logs quati; echo "UI not served"; exit 1; }
          docker logs quati | tail -5
      - name: Verify OpenCode V2 and recording support
        run: |
          docker exec quati opencode --version | grep -E '^opencode v?2\.'
          docker exec quati ffmpeg -version
      - name: Prove the non-root user can browse with the baked-in Chrome
        run: |
          set -euo pipefail
          test "$(docker exec quati id -un)" = quati
          timeout 45 docker exec quati agent-browser --session ci-browser open 'data:text/html,<title>QUATI browser smoke</title><h1>Browser ready</h1>'
          timeout 15 docker exec quati agent-browser --session ci-browser get title | grep -Fx 'QUATI browser smoke'
          # Chrome for Testing's page is 1280x577 until sized; the harness sizes
          # it to 1280x720 so pictures, boxes and clicks agree.
          timeout 15 docker exec quati agent-browser --session ci-browser set viewport 1280 720
          test "$(timeout 15 docker exec quati agent-browser --session ci-browser eval "innerWidth+'x'+innerHeight")" = '"1280x720"'
          # The harness reads and pictures a bot's browser over the engine's
          # loopback relay (server/browser-relay.ts); the daemon writes the file.
          port=$(timeout 15 docker exec quati agent-browser --session ci-browser stream status --json | jq -r .data.port)
          answer=$(docker exec quati curl -sf -X POST -H 'content-type: application/json' -H "origin: http://127.0.0.1:$port" \
            --data '{"action":"screenshot","path":"/tmp/relay.jpg","format":"jpeg","quality":70}' "http://127.0.0.1:$port/api/command")
          grep -q '"success":true' <<<"$answer"
          docker exec quati test -s /tmp/relay.jpg
          timeout 15 docker exec quati agent-browser --session ci-browser close
      - name: Prove the server never binds a public interface
        # The loopback-trust model is the auth model, so the image must keep
        # the server unreachable from the container's own network. Probe from a
        # sibling container on the same bridge; a positive control first proves
        # the probe can see a socket that does bind 0.0.0.0.
        run: |
          set -euo pipefail
          probe() { docker run --rm --network bridge curlimages/curl:8.14.1 -s --max-time 3 "http://$1:$2/" >/dev/null; }
          docker run -d --name leaky --entrypoint node quatibot:ci -e "require('http').createServer((q,s)=>s.end('leak')).listen(8799,'0.0.0.0')"
          sleep 2
          leaky_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' leaky)
          test -n "$leaky_ip"
          probe "$leaky_ip" 8799 || { echo "probe cannot see a 0.0.0.0 listener; the check would be vacuous"; exit 1; }
          docker rm -f leaky >/dev/null
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' quati)
          test -n "$ip"
          if probe "$ip" 8799 || probe "$ip" 8800; then
            echo "server answered on $ip — it must only bind 127.0.0.1"; exit 1
          fi
          echo "unreachable on $ip: loopback-only holds"
      - name: Verify HTTPS, pairing and session security
        # deploy/docker-compose.yml is the product here: through TLS, prove that
        # nothing but the descriptor and the UI shell is served before pairing,
        # that a code minted inside the container turns into a Secure cookie
        # session, that the cookie is same-origin only, that the event stream is
        # unbuffered, and that hooks stay reachable without a session.
        run: |
          set -euo pipefail
          docker rm -f quati >/dev/null
          docker tag quatibot:ci ghcr.io/jlucasrods/quatibot:latest
          printf 'QUATI_SITE=localhost\nQUATI_BIND_ADDRESS=127.0.0.1\nQUATI_HTTP_PORT=80\nQUATI_HTTPS_PORT=443\nQUATI_PUBLIC_URL=https://localhost\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml up -d --no-build
          for i in $(seq 1 45); do
            curl -sk -o /dev/null --max-time 2 https://localhost/.well-known/quatibot/environment && break
            sleep 2
            if [ "$i" = "45" ]; then docker compose -f deploy/docker-compose.yml logs; echo "caddy never answered"; exit 1; fi
          done
          code() { curl -sk -o /dev/null -w '%{http_code}' --max-time 5 "$@"; }
          body() { curl -sk --max-time 10 "$@"; }
          H=https://localhost
          grep -q '"environmentId"' <<<"$(body $H/.well-known/quatibot/environment)"   # descriptor is public
          grep -q '^{"app":"quatibot"}$' <<<"$(body $H/api/health)"             # the probe is public, and says only the app name
          test "$(code $H/api/bots)" = 403                                        # nothing else before pairing
          grep -q 'pair this device' <<<"$(body $H/api/bots)"
          grep -qi '<html' <<<"$(body $H/pair)"                                    # the UI shell is served so /pair can load
          test "$(code http://localhost/)" = 308                                   # HTTP redirects to HTTPS
          pairing=$(docker compose -f deploy/docker-compose.yml exec -T quati node dist-server/pair-cli.js --label ci)
          pcode=$(grep -o 'code=[A-Z2-9-]*' <<<"$pairing" | head -1 | cut -d= -f2)
          test -n "$pcode"
          jar=$(mktemp)
          paired=$(curl -sk --max-time 10 -c "$jar" -D - -X POST $H/api/auth/pair -H 'content-type: application/json' -d "{\"code\":\"$pcode\",\"cookie\":true}")
          grep -qi 'set-cookie: quati_session_' <<<"$paired"                        # cookie session
          grep -qi 'Secure' <<<"$paired"                                          # over TLS the cookie is Secure
          grep -qi 'HttpOnly' <<<"$paired"
          test "$(code -b "$jar" $H/api/health)" = 200                              # paired: the API answers
          grep -q quatibot <<<"$(body -b "$jar" $H/api/health)"
          test "$(code -b "$jar" -H 'Origin: https://evil.example' -X POST -d '{}' $H/api/bots)" = 403   # cookie is same-origin only
          test "$(code -b "$jar" -H 'Origin: https://localhost' $H/api/auth/session)" = 200
          grep -q '"via":"cookie"' <<<"$(body -b "$jar" $H/api/auth/session)"
          grep -q '"label":"ci"' <<<"$(body -b "$jar" $H/api/auth/sessions)"        # listed for revocation
          grep -q error <<<"$(body -X POST $H/hooks/wh_nope)"                      # hook path reaches the receiver without a session
          # The event stream never ends, so curl's own --max-time exit (28) is expected;
          # the proof is that bytes arrived within the window (a buffering proxy sends none).
          sse=$( (curl -sk -b "$jar" -N --max-time 4 $H/api/events || true) | head -c 64 )
          test -n "$sse"                                                           # SSE streams, not buffered
          grep -q '"baseUrl":"https://localhost"' <<<"$(body -b "$jar" $H/api/webhooks)"   # QUATI_WEBHOOK_PUBLIC_URL is advertised
          test "$(code $H/api/bots)" = 403                                        # and without the cookie it is still closed
          docker compose -f deploy/docker-compose.yml restart quati
          for i in $(seq 1 20); do
            test "$(code -b "$jar" $H/api/bots)" = 200 && break
            sleep 2
            if [ "$i" = "20" ]; then docker compose -f deploy/docker-compose.yml logs; exit 1; fi
          done
          grep -q '"via":"cookie"' <<<"$(body -b "$jar" $H/api/auth/session)"
          docker compose -f deploy/docker-compose.yml down -v
  publish:
    name: publish to GHCR
    needs: build-and-smoke
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - id: keys
        run: |
          chrome=$(curl -fsSL --max-time 30 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -er .channels.Stable.version) || chrome="date-$(date -u +%F)"
          echo "chrome=$chrome" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHROME_CACHE_TAG=${{ steps.keys.outputs.chrome }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
